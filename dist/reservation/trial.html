<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Trial - AI Voice Assistant</title>
    <link rel="icon" href="/assets/favicon-DEQwk45s.png" type="image/x-icon">
    <script>
        // Inline Handshake Script for Turnstile Reliability
        window.isTurnstileLoaded = false;
        window.onloadTurnstileCallback = function () {
            window.isTurnstileLoaded = true;
            if (window.renderAppTurnstile) {
                window.renderAppTurnstile();
            }
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit"
        async defer></script>



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <style>
        .iti {
            width: 100%;
            display: block;
        }

        .iti__flag {
            background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/img/flags.png");
        }

        @media (-webkit-min-device-pixel-ratio: 2),
        (min-resolution: 192dpi) {
            .iti__flag {
                background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/img/flags@2x.png");
            }
        }
    </style>
  <script type="module" crossorigin src="/assets/trial-Ckf1oAus.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm-CZUVvyED.js">
  <link rel="modulepreload" crossorigin href="/assets/i18n-gbJxGq1c.js">
  <link rel="modulepreload" crossorigin href="/assets/version-Dr8pX8LW.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-O2Hx6jNt.js">
  <link rel="modulepreload" crossorigin href="/assets/index.esm-AwCycs0Y.js">
  <link rel="modulepreload" crossorigin href="/assets/scam-check-dixBLdR_.js">
  <link rel="stylesheet" crossorigin href="/assets/i18n-CFyyZmGb.css">
</head>

<body class="dashboard-layout">
    <div id="vanta-bg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>

    <!-- Top Header -->
    <div class="top-header">
        <div class="header-content">
            <h1 class="header-title">🐱 WiseCat AI</h1>
            <div style="display: flex; align-items: center; gap: 12px; justify-content: flex-end;">
                <!-- Mobile Language Selector -->
                <select id="languageSelectorHeader" class="language-selector-header">
                    <option value="en">🇺🇸 EN</option>
                    <option value="zh">🇹🇼 中</option>
                    <option value="jp">🇯🇵 日</option>
                    <option value="kr">🇰🇷 한</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="fr">🇫🇷 FR</option>
                    <option value="it">🇮🇹 IT</option>
                </select>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <select id="languageSelector" class="language-selector">
                <option value="en">🇺🇸 English</option>
                <option value="zh">🇹🇼 繁體中文</option>
                <option value="jp">🇯🇵 日本語</option>
                <option value="kr">🇰🇷 한국어</option>
                <option value="es">🇪🇸 Español</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
            </select>

            <div style="text-align: center; margin-bottom: 10px;">
                <a href="/dashboard.html" style="display: inline-block;">
                    <img src="../assets/profile_anim.gif" alt="AI Cat"
                        style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; cursor: pointer;">
                </a>
            </div>

            <h2 data-i18n="trial_title">🎁 Free Trial Call (Beta)</h2>
            <form id="trialForm">
                <label data-i18n="label_name">👤 Name (English Only)</label>
                <input type="text" id="userName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                    data-i18n-placeholder="placeholder_name" placeholder="English name only" required>



                <label data-i18n="label_phone" style="margin-top: 15px;">📞 Target Phone (Recipient)</label>
                <div class="phone-container">
                    <input type="tel" id="targetPhone" required style="width: 100%;">
                </div>
                <div id="phoneHint" style="font-size: 11px; color: #ff4d4d; margin-top: 5px; display: none;"
                    data-i18n="validation_phone">
                    Invalid phone format for selected country
                </div>

                <label data-i18n="label_script_language" style="margin-top: 15px;">🗣️ Speaking Language</label>
                <div style="font-size: 11px; color: #888; margin-bottom: 5px;" id="autoDetectHint">
                    Default auto-detect based on phone number
                </div>
                <select id="scriptLanguage"
                    style="width: 100%; padding: 12px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white; margin-bottom: 20px;">
                    <option value="auto" data-i18n="option_auto" selected>✨ Auto-Detect</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="zh">🇹🇼 繁體中文</option>
                    <option value="jp">🇯🇵 日本語</option>
                    <option value="kr">🇰🇷 한국어</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="it">🇮🇹 Italiano</option>
                </select>

                <label data-i18n="label_trial_script" style="margin-top: 15px;">📄 Trial Message Script (Max 30
                    words)</label>
                <textarea id="scriptContent" rows="4" data-i18n-placeholder="placeholder_trial_script"
                    placeholder="What should the AI say?" required></textarea>
                <div id="wordCounter" style="text-align: right; font-size: 12px; color: #888; margin-top: 2px;">
                    0 / 30 words
                </div>

                <div id="turnstile-widget" style="margin-top: 20px;"></div>

                <button type="submit" id="submitBtn" data-i18n="btn_trial" disabled>Try for Free</button>
                <a href="/dashboard.html" class="back-link" data-i18n="btn_back">← Back to Dashboard</a>
                <div class="footer" data-i18n="footer">Automated call service provided by WiseCat AI</div>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) / Side Navigation (Desktop) -->
    <nav class="bottom-nav">
        <!-- Sidebar Top Section (Desktop Only) -->
        <div class="sidebar-top-section">
            <select id="languageSelector" class="language-selector-sidebar">
                <option value="en">🇺🇸 English</option>
                <option value="zh">🇹🇼 繁體中文</option>
                <option value="jp">🇯🇵 日本語</option>
                <option value="kr">🇰🇷 한국어</option>
                <option value="es">🇪🇸 Español</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
            </select>
        </div>

        <!-- Sidebar User Section (Desktop Only) - MOVED TO TOP -->
        <div class="sidebar-user-section">
            <div class="sidebar-user-info" onclick="window.location.href='/dashboard.html?tab=profile'">
                <img id="headerUserAvatar" src="https://ui-avatars.com/api/?name=Guest" alt="Avatar">
                <div class="sidebar-user-text">
                    <div id="headerUserName">Guest</div>
                    <div id="creditsDisplay" class="sidebar-credits">$0.00</div>
                </div>
            </div>
            <button id="headerLogoutBtn" class="sidebar-logout-btn">
                <span data-i18n="nav_logout">Log out</span>
            </button>
        </div>

        <a href="/dashboard.html?tab=calls" class="nav-item">
            <span class="nav-icon">📞</span>
            <span class="nav-label" data-i18n="nav_calls">Calls</span>
        </a>
        <a href="/dashboard.html?tab=profile" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-label" data-i18n="nav_profile">Profile</span>
        </a>
        <a href="/dashboard.html?tab=add" class="nav-item">
            <span class="nav-icon">📱</span>
            <span class="nav-label" data-i18n="nav_phone">Phone Number</span>
        </a>
        <a href="/dashboard.html?tab=ai" class="nav-item active">
            <span class="nav-icon">🤖</span>
            <span class="nav-label" data-i18n="nav_ai">AI Hub</span>
        </a>
        <a href="/dashboard.html?tab=inbox" class="nav-item">
            <span class="nav-icon">💬</span>
            <span class="nav-label" data-i18n="nav_inbox">Inbox</span>
        </a>
    </nav>

</body>

</html>

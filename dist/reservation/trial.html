<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Trial - AI Voice Assistant</title>
    <link rel="icon" href="/assets/favicon-DEQwk45s.png" type="image/x-icon">
    <script>
        // Inline Handshake Script for Turnstile Reliability
        window.isTurnstileLoaded = false;
        window.onloadTurnstileCallback = function () {
            window.isTurnstileLoaded = true;
            if (window.renderAppTurnstile) {
                window.renderAppTurnstile();
            }
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit"
        async defer></script>



    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <style>
        .iti {
            width: 100%;
            display: block;
        }

        .iti__flag {
            background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/img/flags.png");
        }

        @media (-webkit-min-device-pixel-ratio: 2),
        (min-resolution: 192dpi) {
            .iti__flag {
                background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/img/flags@2x.png");
            }
        }
    </style>
  <script type="module" crossorigin src="/assets/trial-DXPshpc9.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm-BdKKplyx.js">
  <link rel="modulepreload" crossorigin href="/assets/i18n-DEP_FhY5.js">
  <link rel="modulepreload" crossorigin href="/assets/version-DCg5g3Z2.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-BVuuoQhp.js">
  <link rel="stylesheet" crossorigin href="/assets/i18n-BL-2p4i6.css">
</head>

<body class="dashboard-layout">
    <!-- Hamburger Menu (Mobile Only) -->
    <button class="hamburger-menu" id="hamburgerMenu" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Mobile Sidebar Overlay -->
    <div class="mobile-sidebar-overlay" id="mobileSidebarOverlay"></div>


    <canvas id="bg-canvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></canvas>

    <!-- Top Header -->
    <div class="top-header">
        <div class="header-content">
            <h1 class="header-title" onclick="window.location.href='/dashboard.html#profile'" style="cursor: pointer;">
                🐱 WiseCat AI</h1>
            <div style="display: flex; align-items: center; gap: 12px; justify-content: flex-end;">
                <!-- Mobile Language Selector -->
                <select id="languageSelectorHeader" class="language-selector-header">
                    <option value="en">🇺🇸 EN</option>
                    <option value="zh">🇹🇼 中</option>
                    <option value="jp">🇯🇵 日</option>
                    <option value="kr">🇰🇷 한</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="fr">🇫🇷 FR</option>
                    <option value="it">🇮🇹 IT</option>
                </select>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="card" style="max-width: 600px; margin: 0 auto;">


            <div style="text-align: center; margin-bottom: 10px;">
                <a href="/dashboard.html" style="display: inline-block;">
                    <img src="../assets/profile_anim.gif" alt="AI Cat"
                        style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; cursor: pointer;">
                </a>
            </div>

            <h2 data-i18n="trial_title">🎁 Free Trial Call (Beta)</h2>
            <form id="trialForm">
                <label data-i18n="label_name">👤 Name (English Only)</label>
                <input type="text" id="userName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                    data-i18n-placeholder="placeholder_name" placeholder="English name only" required>



                <label data-i18n="label_phone" style="margin-top: 15px;">📞 Target Phone (Recipient)</label>


                <div class="phone-container">
                    <input type="tel" id="targetPhone" required style="width: 100%;">
                </div>
                <div id="phoneHint" style="font-size: 11px; color: #ff4d4d; margin-top: 5px; display: none;"
                    data-i18n="validation_phone">
                    Invalid phone format for selected country
                </div>

                <label data-i18n="label_script_language" style="margin-top: 15px;">🗣️ Speaking Language</label>
                <div style="font-size: 11px; color: #888; margin-bottom: 5px;" id="autoDetectHint">
                    Default auto-detect based on phone number
                </div>
                <select id="scriptLanguage"
                    style="width: 100%; padding: 12px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white; margin-bottom: 20px;">
                    <option value="auto" data-i18n="option_auto" selected>✨ Auto-Detect</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="zh">🇹🇼 繁體中文</option>
                    <option value="jp">🇯🇵 日本語</option>
                    <option value="kr">🇰🇷 한국어</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="it">🇮🇹 Italiano</option>
                </select>

                <label data-i18n="label_trial_script" style="margin-top: 15px;">📄 Trial Message Script (Max 30
                    words)</label>
                <textarea id="scriptContent" rows="4" data-i18n-placeholder="placeholder_trial_script"
                    placeholder="What should the AI say?" required></textarea>
                <div id="wordCounter" style="text-align: right; font-size: 12px; color: #888; margin-top: 2px;">
                    0 / 30 words
                </div>

                <!-- Validation Button and Feedback -->
                <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                    <button type="button" id="validateBtn"
                        style="flex: 1; padding: 10px 16px; background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                        <span data-i18n="validate_btn">🔍 Check Script</span>
                    </button>
                </div>
                <div id="validationFeedback"
                    style="margin-top: 8px; padding: 10px; border-radius: 8px; font-size: 13px; display: none;"></div>

                <div id="turnstile-widget" style="margin-top: 20px;"></div>

                <!-- Call Consent Agreement -->
                <label class="agreement-box" for="consentCheckbox"
                    style="margin-top: 20px; margin-bottom: 20px; display: flex;">
                    <div class="custom-checkbox">
                        <input type="checkbox" id="consentCheckbox" required>
                        <span class="checkmark"></span>
                    </div>
                    <span class="agreement-text" data-i18n="label_agree_call">
                        I agree to let the AI call on my behalf. If I do not agree, I will not be granted access.
                    </span>
                </label>

                <button type="submit" id="submitBtn" data-i18n="btn_trial" disabled>Try for Free</button>
                <a href="/dashboard.html" class="back-link" data-i18n="btn_back">← Back to Dashboard</a>
                <div class="footer" data-i18n="footer">Automated call service provided by WiseCat AI</div>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) / Side Navigation (Desktop) -->
    <nav class="bottom-nav">
        <!-- Sidebar Top Section (Desktop Only) -->
        <div class="sidebar-top-section">
            <select id="languageSelector" class="language-selector-sidebar">
                <option value="en">🇺🇸 English</option>
                <option value="zh">🇹🇼 繁體中文</option>
                <option value="jp">🇯🇵 日本語</option>
                <option value="kr">🇰🇷 한국어</option>
                <option value="es">🇪🇸 Español</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
            </select>
        </div>
        <button class="nav-item" data-tab="profile" onclick="window.location.href='/dashboard.html?tab=profile'">
            <span class="nav-icon">👤</span>
            <span class="nav-label" data-i18n="nav_profile">Profile</span>
        </button>
        <button class="nav-item" data-tab="add" onclick="window.location.href='/dashboard.html?tab=add'">
            <span class="nav-icon">📱</span>
            <span class="nav-label" data-i18n="nav_phone">Buy Number</span>
        </button>
        <!-- AI Services Dropdown -->
        <div class="nav-dropdown open">
            <button class="nav-item nav-dropdown-toggle" id="aiDropdownToggle">
                <span class="nav-icon">🤖</span>
                <span class="nav-label" data-i18n="nav_ai">AI Services</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="nav-dropdown-menu" id="aiDropdownMenu">
                <a href="/reservation/restaurant_reservation.html" class="nav-dropdown-item">
                    <span class="nav-icon">🍽️</span>
                    <span class="nav-label">Restaurant</span>
                </a>
                <a href="/reservation/mouthpiece.html" class="nav-dropdown-item">
                    <span class="nav-icon">📢</span>
                    <span class="nav-label">Mouthpiece</span>
                </a>
                <a href="/reservation/trial.html" class="nav-dropdown-item active">
                    <span class="nav-icon">🎁</span>
                    <span class="nav-label">Trial</span>
                </a>
            </div>
        </div>
        <button class="nav-item" data-tab="inbox" onclick="window.location.href='/dashboard.html?tab=inbox'">
            <span class="nav-icon">💬</span>
            <span class="nav-label" data-i18n="nav_inbox">Inbox</span>
        </button>

        <!-- Contact -->
        <a href="https://line.me/R/ti/p/@785ausca" target="_blank" class="nav-item contact-link">
            <span class="nav-icon">🎧</span>
            <span class="nav-label" data-i18n="nav_contact">Contacts</span>
        </a>

        <!-- Sidebar User Section (Desktop Only) -->
        <div class="sidebar-user-section">
            <div class="sidebar-user-info" onclick="window.location.href='/dashboard.html?tab=profile'">
                <img id="headerUserAvatar" src="https://ui-avatars.com/api/?name=Guest" alt="Avatar">
                <div class="sidebar-user-text">
                    <div id="headerUserName">Guest</div>
                    <div id="creditsDisplay" class="sidebar-credits">$0.00</div>
                </div>
            </div>
            <button id="headerLogoutBtn" class="sidebar-logout-btn">
                <span data-i18n="nav_logout">Log out</span>
            </button>
        </div>
    </nav>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <h3 data-i18n="modal_confirm_title">Confirm Selection</h3>
            <div id="confirmDetails" class="modal-details">
                <!-- Details injected here -->
            </div>
            <div class="modal-actions">
                <button id="modalCancel" class="modal-btn cancel" data-i18n="modal_cancel_btn">Cancel</button>
                <button id="modalConfirm" class="modal-btn confirm" data-i18n="modal_confirm_btn">Confirm</button>
            </div>
        </div>
    </div>


    <script>
        // Hamburger Menu Toggle
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburgerMenu');
            const nav = document.querySelector('.bottom-nav');
            const overlay = document.getElementById('mobileSidebarOverlay');
            
            if (hamburger && nav && overlay) {
                // Toggle menu
                hamburger.addEventListener('click', () => {
                    hamburger.classList.toggle('active');
                    nav.classList.toggle('mobile-open');
                    overlay.classList.toggle('show');
                    document.body.classList.toggle('menu-open');
                });
                
                // Close on overlay click
                overlay.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    nav.classList.remove('mobile-open');
                    overlay.classList.remove('show');
                    document.body.classList.remove('menu-open');
                });
                
                // Close on nav item click (for mobile)
                const navItems = nav.querySelectorAll('.nav-item:not(.nav-dropdown-toggle), .nav-dropdown-item');
                navItems.forEach(item => {
                    item.addEventListener('click', () => {
                        if (window.innerWidth < 1024) {
                            hamburger.classList.remove('active');
                            nav.classList.remove('mobile-open');
                            overlay.classList.remove('show');
                            document.body.classList.remove('menu-open');
                        }
                    });
                });
            }
        });
    </script>
</body>

</html>

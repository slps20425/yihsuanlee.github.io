<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard | WiseCat Admin</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }

        /* Table */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .priority-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #334155;
            color: #ccc;
        }

        .p-5 {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Critical */
        .p-4 {
            background: rgba(249, 115, 22, 0.2);
            color: #fdba74;
        }

        /* High */
        .p-3 {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }

        /* Normal */

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
        }

        .status-done {
            color: var(--success);
        }

        .status-pending {
            color: var(--text-secondary);
        }

        /* Modal */
        dialog {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .modal-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        [hidden] {
            display: none !important;
        }

        /* User Profile */
        .user-profile {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            margin-right: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent);
        }

        .user-info {
            text-align: left;
            margin-right: 8px;
        }

        .user-name {
            font-weight: bold;
            font-size: 14px;
            color: var(--text-primary);
        }

        .user-email {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--danger);
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .container {
                max-width: 100%;
            }

            /* Header */
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            /* User Profile - Compact on mobile */
            .user-profile {
                width: 100%;
                justify-content: space-between;
                margin-right: 0;
                padding: 10px 12px;
            }

            .user-info {
                margin-right: 0;
            }

            .user-name {
                font-size: 13px;
            }

            .user-email {
                font-size: 10px;
            }

            /* New Task Button - Full width */
            #newTaskBtn {
                width: 100%;
                padding: 0.75rem 1rem;
                font-size: 1rem;
            }

            /* Table - Horizontal scroll */
            .card {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            table {
                min-width: 800px;
            }

            th,
            td {
                padding: 0.75rem 0.5rem;
                font-size: 0.85rem;
            }

            /* Hide less important columns on mobile */
            th:nth-child(1),
            td:nth-child(1),
            th:nth-child(5),
            td:nth-child(5),
            th:nth-child(6),
            td:nth-child(6) {
                display: none;
            }

            /* Priority badges */
            .priority-badge {
                font-size: 0.7rem;
                padding: 0.2rem 0.4rem;
            }

            /* Modal */
            dialog {
                max-width: 90%;
                width: 90%;
                padding: 1.5rem;
                margin: 1rem;
            }

            dialog h2 {
                font-size: 1.25rem;
            }

            .form-group {
                margin-bottom: 0.875rem;
            }

            input,
            select,
            textarea {
                padding: 0.625rem;
                font-size: 16px;
            }

            .modal-footer {
                flex-direction: column;
                gap: 0.75rem;
            }

            .modal-footer .btn {
                width: 100%;
            }

            /* Pagination */
            #paginationControls {
                flex-direction: column;
                gap: 0.5rem;
                padding: 0.75rem;
            }

            #paginationControls button {
                width: 100%;
            }

            /* Login Content */
            #loginContent {
                max-width: 90%;
                margin: 10vh auto;
                padding: 0 1rem;
            }

            #loginContent h2 {
                font-size: 1.25rem;
            }

            #loginContent .btn {
                padding: 0.875rem 1rem;
                font-size: 0.9rem;
            }
        }

        /* Extra small screens */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            h1 {
                font-size: 1.1rem;
            }

            .card {
                border-radius: 8px;
            }

            table {
                min-width: 700px;
            }

            th,
            td {
                padding: 0.5rem 0.3rem;
                font-size: 0.8rem;
            }

            .action-cell button {
                font-size: 1rem;
                padding: 0.25rem;
            }
        }
    </style>
  <script type="module" crossorigin src="/assets/admin_tasks-BchJO0Rj.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm-DDjZhlwz.js">
</head>

<body>

    <!-- Auth Check -->
    <div id="authCheck" style="text-align: center; margin-top: 20vh;">Checking access...</div>

    <!-- Main Content -->
    <div id="mainContent" class="container" hidden>
        <header>
            <div>
                <h1>Dev Tasks</h1>
                <p style="color: var(--text-secondary); margin: 0.25rem 0 0 0;">Manage testing and development tasks.
                </p>
            </div>
            <div class="header-actions">
                <div id="userProfileDisplay"></div>
                <button id="newTaskBtn" class="btn btn-primary">+ New Task</button>
            </div>
        </header>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">No.</th>
                        <th style="width: 60px; cursor: pointer;" data-sort="priority">Pri ↕</th>
                        <th style="cursor: pointer;" data-sort="title">Title ↕</th>
                        <th style="cursor: pointer;" data-sort="content">Description ↕</th>
                        <th style="width: 140px; cursor: pointer;" data-sort="createdAt">Created ↕</th>
                        <th style="width: 120px; cursor: pointer;" data-sort="createdBy">Requested By ↕</th>
                        <th style="width: 100px; cursor: pointer;" data-sort="completed">Status ↕</th>
                        <th style="width: 80px;">Action</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; color: var(--text-secondary);">Loading tasks...</td>
                    </tr>
                </tbody>
            </table>

            <div id="paginationControls"
                style="display: flex; justify-content: flex-end; align-items: center; padding: 1rem; gap: 1rem; border-top: 1px solid var(--border);">
                <button id="prevPageBtn" class="btn btn-ghost" disabled>Previous</button>
                <span id="pageIndicator" style="color: var(--text-secondary); font-size: 0.9em;">Page 1 of 1</span>
                <button id="nextPageBtn" class="btn btn-ghost" disabled>Next</button>
            </div>
        </div>
    </div>

    <!-- New Task Modal -->
    <dialog id="taskModal">
        <h2 style="margin-top:0;">New Task</h2>
        <form method="dialog" id="taskForm">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="titleInput" placeholder="e.g. Fix login bug" required>
            </div>

            <div class="form-group">
                <label>Priority</label>
                <select id="priorityInput">
                    <option value="1">1 - Low</option>
                    <option value="2">2 - Minor</option>
                    <option value="3" selected>3 - Normal</option>
                    <option value="4">4 - High</option>
                    <option value="5">5 - Critical</option>
                </select>
            </div>

            <div class="form-group">
                <label>Attachment (Image/Log)</label>
                <input type="file" id="fileInput" accept="image/*,.log,.txt,.pdf">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="descInput" rows="4" placeholder="Details..." required></textarea>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">Create Task</button>
            </div>
        </form>
    </dialog>

    <!-- Login Content -->
    <div id="loginContent" style="max-width: 400px; margin: 20vh auto; text-align: center;" hidden>
        <h2 style="margin-bottom: 30px;">Admin Login Required</h2>

        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
            <!-- Google Login -->
            <button type="button" class="btn btn-primary" id="googleLoginBtn"
                style="background: #fff; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.95rem;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                    style="width: 20px; height: 20px;">
                <span>Sign in with Google</span>
            </button>

            <!-- Microsoft Login -->
            <button type="button" class="btn btn-primary" id="microsoftLoginBtn"
                style="background: #2f2f2f; color: #fff; border: 1px solid #444; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.95rem;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft"
                    style="width: 20px; height: 20px;">
                <span>Sign in with Microsoft</span>
            </button>
        </div>

        <div id="authError" style="color: var(--danger); margin-top: 15px; text-align: center; font-size: 14px;"></div>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
            <a href="/" style="color: var(--accent); font-size: 14px; text-decoration: none;">← Back to Portal</a>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Reservation Assistant</title>
    <link rel="icon" href="../favicon.png" type="image/x-icon">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="../styles.css">
    <script src="../i18n.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
</head>

<body>
    <div id="vanta-bg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>
    <div class="card">
        <select id="languageSelector" class="language-selector">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇹🇼 繁體中文</option>
            <option value="jp">🇯🇵 日本語</option>
            <option value="kr">🇰🇷 한국어</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="it">🇮🇹 Italiano</option>
        </select>

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MXB6Mmo2ODEzYmU4aW1ia3JuZzg1dmszN2s5OGFjODJuY3ZmZnVpOSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bZCy0rf8TBRB2hYfUg/giphy.gif"
                alt="AI Cat" style="width: 100px; border-radius: 50%;">
        </div>


        <h2 data-i18n="reservation_title">✨ AI Reservation</h2>
        <form id="resForm">
            <label data-i18n="label_name">👤 Name (English Only)</label>
            <input type="text" id="userName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                data-i18n-placeholder="placeholder_name" placeholder="English name only" required>

            <label data-i18n="label_party">👥 Party Size</label>
            <input type="number" id="partySize" value="2" min="1" max="50" step="1" required>

            <label data-i18n="label_date">📅 Date</label>
            <input type="text" id="resDate" data-i18n-placeholder="placeholder_date" placeholder="Select Date"
                onfocus="(this.type='date')" onblur="(this.value ? this.type='date' : this.type='text')" required>

            <label data-i18n="label_time">⏰ Time</label>
            <input type="time" id="resTime" required>

            <label data-i18n="label_search">🔍 Search Restaurant</label>
            <div class="search-container" style="position: relative;">
                <input type="text" id="restaurantSearch" data-i18n-placeholder="placeholder_search"
                    placeholder="Enter restaurant name or address">
                <div class="info-text" data-i18n="info_search" style="font-size: 12px; color: #888; margin-top: 5px;">
                    Phone number auto-filled after search</div>
                <div id="searchResults" class="search-results"
                    style="position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1px solid #444; border-radius: 12px; margin-top: 5px; max-height: 300px; overflow-y: auto; z-index: 1000; display: none;">
                </div>
            </div>

            <label data-i18n="label_phone">📞 Phone</label>
            <div class="phone-container" style="display: flex; gap: 10px; margin-top: 5px;">
                <select id="countryCode" required style="width: 35%;">
                    <option value="+886">🇹🇼 +886</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+81">🇯🇵 +81</option>
                    <option value="+82">🇰🇷 +82</option>
                    <option value="+86">🇨🇳 +86</option>
                    <option value="+852">🇭🇰 +852</option>
                    <option value="+853">🇲🇴 +853</option>
                    <option value="+65">🇸🇬 +65</option>
                    <option value="+60">🇲🇾 +60</option>
                    <option value="+66">🇹🇭 +66</option>
                    <option value="+84">🇻🇳 +84</option>
                    <option value="+63">🇵🇭 +63</option>
                    <option value="+62">🇮🇩 +62</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+64">🇳🇿 +64</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+33">🇫🇷 +33</option>
                    <option value="+49">🇩🇪 +49</option>
                    <option value="+39">🇮🇹 +39</option>
                    <option value="+34">🇪🇸 +34</option>
                    <option value="+7">🇷🇺 +7</option>
                    <option value="+91">🇮🇳 +91</option>
                </select>
                <input type="tel" id="targetPhone" placeholder="912345678" required style="width: 65%;">
            </div>

            <label data-i18n="label_note">📝 Special Requests (Optional)</label>
            <textarea id="note" rows="3"
                style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white;"
                data-i18n-placeholder="placeholder_note" placeholder="Any special requests?"></textarea>

            <div id="mapContainer" class="map-container"
                style="margin-top: 15px; border-radius: 12px; overflow: hidden; height: 250px; display: none;">
                <div id="map" style="width: 100%; height: 100%;"></div>
            </div>

            <label data-i18n="label_schedule" style="margin-top: 20px;">Schedule Call Preference</label>
            <select id="schedulePreference">
                <option value="open" data-i18n="option_open">Call when restaurant open</option>
                <option value="asap" data-i18n="option_asap">Call ASAP</option>
            </select>

            <div class="retry-container">
                <input type="checkbox" id="retryOption">
                <label for="retryOption">
                    <span data-i18n="label_retry">Re-try 1 time</span>
                    <span class="warning-text" data-i18n="warning_retry">(This will charge you twice, careful)</span>
                </label>
            </div>

            <div class="credits-card" style="margin-top: 45px;">
                <div class="credits-info">
                    <span id="creditsDisplay" data-i18n="text_credits" style="font-weight: bold; color: #fff;">Current
                        Credits: $0 USD</span>
                </div>
                <a href="https://core.newebpay.com/EPG/MS123456789/Example" target="_blank" data-i18n="btn_refill"
                    class="refill-btn">Refill</a>
            </div>

            <div class="cf-turnstile" data-sitekey="0x4AAAAAACKreG1nTIC_lSzg" data-callback="onTurnstileSuccess"
                style="margin-top: 20px;"></div>

            <button type="submit" id="submitBtn" data-i18n="btn_submit" disabled>Start AI Call</button>
            <a href="../Entry.html" class="back-link" data-i18n="btn_back">← Back to Portal</a>
            <div class="footer" data-i18n="footer">Automated call service provided by WiseCat AI</div>
        </form>
    </div>

    <!-- Help Buddy -->
    <button class="helper-buddy" id="helperBuddy">🐱</button>
    <div class="helper-panel" id="helperPanel">
        <div class="helper-header">
            <span data-i18n="helper_title">AI Prompt Helper 🐱</span>
            <span class="helper-close" id="helperClose">✕</span>
        </div>
        <!-- Examples are rendered dynamically from i18n.js -->
    </div>

    <script>
        // const LIFF_ID = '2008812650-lyjR7Z5O'; // Removed
        const N8N_WEBHOOK = 'https://wisecat.app.n8n.cloud/webhook-test/line-reservation';
        const GOOGLE_MAPS_API_KEY = 'AIzaSyA1ycN9_H2nI_Oh8ZypPtGcqyZ5QQhkLIk';

        let map;
        let placesService;
        let searchTimeout;
        let currentMarker = null;

        // Turnstile Success Callback
        function onTurnstileSuccess(token) {
            console.log("Validation Successful, Token:", token);
            const btn = document.getElementById('submitBtn');

            // Re-check credits
            const userSession = localStorage.getItem('wisecat_user');
            let credits = 0;
            if (userSession) {
                try {
                    credits = JSON.parse(userSession).credits || 0;
                } catch (e) { }
            }

            if (credits > 0) {
                btn.disabled = false;
                btn.style.opacity = "1";
            } else {
                console.log("Button stays disabled: 0 credits");
                btn.disabled = true;
                btn.style.opacity = "0.5";
            }
        }

        // Scam Detector Logic
        const ScamDetector = {
            patterns: [
                /投資獲利|飆股|加賴|加LINE|賺錢|兼職|獲利|高報酬|博弈/i,
                /investment|profit|crypto|jackpot|lottery|free money|giveaway/i,
                /恭喜中獎|領取獎品|點擊連結|驗證身分|帳戶異常/i,
                /congratulations|winner|claim prize|verify account|unusual activity/i,
                /kiếm tiền|nhận thưởng|หัวหน้า|โบนัส/i
            ],
            isScam(text) {
                const cleanText = text.replace(/[^\w\s\u4e00-\u9fa5]/gi, '').replace(/\s+/g, '');
                return this.patterns.some(regex => regex.test(cleanText));
            }
        };

        // Cache to reduce API calls
        const placeDetailsCache = {};

        // Check for logged-in user and auto-fill name
        window.addEventListener('DOMContentLoaded', () => {
            const userSession = localStorage.getItem('wisecat_user');
            const btn = document.getElementById('submitBtn');
            const creditsDisplay = document.getElementById('creditsDisplay');

            if (userSession) {
                try {
                    const user = JSON.parse(userSession);
                    document.getElementById('userName').value = user.name || "";

                    // Update Credits Display
                    const credits = user.credits || 0;
                    if (creditsDisplay) {
                        const dict = WiseCatI18n.translations[WiseCatI18n.currentLang] || WiseCatI18n.translations['en'];
                        const creditTextTemplate = dict.text_credits || "Current Credits: $0 USD";
                        creditsDisplay.innerText = creditTextTemplate.replace('$0', `$${credits}`);
                    }

                    // Initial button state check (will be overridden by Turnstile)
                    if (credits <= 0) {
                        btn.disabled = true;
                        btn.style.opacity = "0.5";
                    }
                } catch (e) {
                    console.error('Error loading user session:', e);
                }
            } else {
                // Not logged in - disable button anyway
                btn.disabled = true;
                btn.style.opacity = "0.5";
            }
        });

        // Load Google Maps API dynamically
        function loadGoogleMapsAPI() {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&language=zh-TW`;
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Initialize Google Maps
        async function initMap() {
            try {
                await loadGoogleMapsAPI();

                // Default center (Taipei)
                const defaultLocation = { lat: 25.0330, lng: 121.5654 };

                map = new google.maps.Map(document.getElementById('map'), {
                    center: defaultLocation,
                    zoom: 15,
                    styles: [
                        {
                            "elementType": "geometry",
                            "stylers": [{ "color": "#212121" }]
                        },
                        {
                            "elementType": "labels.text.fill",
                            "stylers": [{ "color": "#757575" }]
                        },
                        {
                            "elementType": "labels.text.stroke",
                            "stylers": [{ "color": "#212121" }]
                        }
                    ]
                });

                placesService = new google.maps.places.PlacesService(map);

            } catch (error) {
                console.error('Error loading Google Maps:', error);
                alert('無法載入 Google Maps。請確認網路連線。');
            }
        }

        // Get place details with phone number (with caching)
        function getPlaceDetails(placeId) {
            // Check cache first
            if (placeDetailsCache[placeId]) {
                console.log('Using cached place details');
                return Promise.resolve(placeDetailsCache[placeId]);
            }

            return new Promise((resolve, reject) => {
                const request = {
                    placeId: placeId,
                    fields: ['name', 'formatted_address', 'formatted_phone_number', 'international_phone_number', 'geometry']
                };

                placesService.getDetails(request, (place, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        // Cache the result
                        placeDetailsCache[placeId] = place;
                        resolve(place);
                    } else {
                        reject(status);
                    }
                });
            });
        }

        // Search for places
        async function searchPlaces(query) {
            if (!query || query.length < 2) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '<div class="loading">搜尋中...</div>';
            resultsContainer.classList.add('show');

            // Auto-detect location based on query
            let location = { lat: 25.0330, lng: 121.5654 }; // Default: Taipei

            // If query contains Japanese characters, search in Tokyo
            if (/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/.test(query)) {
                location = { lat: 35.6762, lng: 139.6503 }; // Tokyo
            }

            const request = {
                query: query + ' restaurant',
                fields: ['name', 'formatted_address', 'place_id', 'geometry'],
                locationBias: location
            };

            placesService.textSearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                    displaySearchResults(results.slice(0, 5));
                } else {
                    resultsContainer.innerHTML = '<div class="loading">找不到餐廳</div>';
                }
            });
        }

        // Display search results
        function displaySearchResults(places) {
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            places.forEach(place => {
                const item = document.createElement('div');
                item.className = 'search-result-item';

                const name = document.createElement('div');
                name.className = 'result-name';
                name.textContent = place.name;

                const address = document.createElement('div');
                address.className = 'result-address';
                address.textContent = place.formatted_address || '地址未提供';

                const phone = document.createElement('div');
                phone.className = 'result-phone';
                phone.textContent = '點擊查看電話';

                item.appendChild(name);
                item.appendChild(address);
                item.appendChild(phone);

                item.addEventListener('click', async () => {
                    phone.textContent = '載入中...';
                    try {
                        const detailedPlace = await getPlaceDetails(place.place_id);
                        selectPlace(detailedPlace);
                    } catch (error) {
                        console.error('Error getting place details:', error);
                        alert('無法取得餐廳電話，請手動輸入');
                        selectPlace(place);
                    }
                });

                resultsContainer.appendChild(item);
            });
        }

        // Select a place from search results
        function selectPlace(place) {
            console.log('Selected place:', place);

            // Fill in phone number
            const phoneNumber = place.international_phone_number || place.formatted_phone_number;

            if (phoneNumber) {
                console.log('Phone found:', phoneNumber);

                // Clean phone number
                let cleanPhone = phoneNumber.replace(/\s/g, '').replace(/-/g, '').replace(/\(/g, '').replace(/\)/g, '');

                // Handle Taiwan numbers
                if (cleanPhone.startsWith('+886')) {
                    document.getElementById('countryCode').value = '+886';
                    document.getElementById('targetPhone').value = cleanPhone.substring(4);
                }
                // Handle Japan numbers
                else if (cleanPhone.startsWith('+81')) {
                    document.getElementById('countryCode').value = '+81';
                    document.getElementById('targetPhone').value = cleanPhone.substring(3);
                }
                // Handle local format (starting with 0)
                else if (cleanPhone.startsWith('0')) {
                    // Detect if it's Taiwan or Japan based on phone length or context
                    // Taiwan mobile: 09XX-XXX-XXX (10 digits)
                    // Japan: 0X-XXXX-XXXX or 03-XXXX-XXXX (9-10 digits)
                    if (cleanPhone.length === 10 && cleanPhone.startsWith('09')) {
                        // Taiwan mobile
                        document.getElementById('countryCode').value = '+886';
                        document.getElementById('targetPhone').value = cleanPhone.substring(1);
                    } else {
                        // Assume Japan for other 0-prefix numbers
                        document.getElementById('countryCode').value = '+81';
                        document.getElementById('targetPhone').value = cleanPhone.substring(1);
                    }
                }
                else if (cleanPhone.startsWith('+')) {
                    const countryCodeMatch = cleanPhone.match(/^\+(\d{1, 3})/);
                    if (countryCodeMatch) {
                        const code = '+' + countryCodeMatch[1];
                        document.getElementById('countryCode').value = code;
                        document.getElementById('targetPhone').value = cleanPhone.substring(code.length);
                    }
                }
                else {
                    // Default: Taiwan
                    document.getElementById('countryCode').value = '+886';
                    document.getElementById('targetPhone').value = cleanPhone;
                }
            } else {
                console.warn('No phone number available');
                alert('此餐廳沒有提供電話號碼，請手動輸入');
            }

            // Update map
            if (place.geometry && place.geometry.location) {
                map.setCenter(place.geometry.location);
                map.setZoom(17);

                // Clear existing marker
                if (currentMarker) {
                    currentMarker.setMap(null);
                }

                currentMarker = new google.maps.Marker({
                    map: map,
                    position: place.geometry.location,
                    title: place.name,
                    animation: google.maps.Animation.DROP
                });

                document.getElementById('mapContainer').classList.add('show');
            }

            // Hide search results
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('restaurantSearch').value = place.name;
        }

        // Restaurant search with debounce
        document.getElementById('restaurantSearch').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchPlaces(e.target.value);
            }, 500);
        });

        // Hide search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchResults').classList.remove('show');
            }
        });

        // Initialize
        initMap();

        // ----------------------------------------------------
        // Form Submission Logic
        // ----------------------------------------------------
        document.getElementById('resForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Scam Detection Check
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('targetPhone').value;
            const note = document.getElementById('note').value;
            const userInput = name + phone + note;

            if (ScamDetector.isScam(userInput)) {
                alert("⚠️ Suspicious content detected, please check your input.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('targetPhone').value.replace(/^0+/, '');
            const fullPhoneNumber = countryCode + phoneNumber;

            const payload = {
                type: 'reservation',
                Name: document.getElementById('userName').value,
                'Party Size': document.getElementById('partySize').value,
                'date/month/year': document.getElementById('resDate').value,
                time: document.getElementById('resTime').value,
                targetPhoneNumber: fullPhoneNumber,
                note: document.getElementById('note').value,
                language: WiseCatI18n.currentLang,
                schedulePreference: document.getElementById('schedulePreference').value,
                retryOneTime: document.getElementById('retryOption').checked
            };

            // i18n Dictionary for script alerts
            const dict = WiseCatI18n.translations[WiseCatI18n.currentLang] || WiseCatI18n.translations['en'];

            // Validation for Name
            const namePattern = /^[a-zA-Z\s\-_]*$/;
            if (!namePattern.test(payload.Name)) {
                alert(dict.validation_name || "Name must be English letters only");
                btn.disabled = false;
                return;
            }

            try {
                const response = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btn.innerText = dict.msg_success;
                    alert(dict.msg_calling);
                } else {
                    throw new Error();
                }
            } catch (error) {
                btn.innerText = dict.msg_failed;
                alert(dict.msg_fail_alert);
                btn.disabled = false;
            }
        });

        // Initialize
        initMap();

        // Initialize Vanta Waves
        VANTA.WAVES({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x2e5482,
            shininess: 30.00,
            waveHeight: 15.00,
            waveSpeed: 1.00,
            zoom: 1.00
        });

        // Helper Buddy Logic
        const buddy = document.getElementById('helperBuddy');
        const panel = document.getElementById('helperPanel');
        const close = document.getElementById('helperClose');

        buddy.addEventListener('click', () => panel.classList.toggle('show'));
        close.addEventListener('click', () => panel.classList.remove('show'));
    </script>
</body>

</html>

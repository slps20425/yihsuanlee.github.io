<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Trial - AI Voice Assistant</title>
    <link rel="icon" href="../favicon.png" type="image/x-icon">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="../styles.css">
    <script src="../i18n.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <style>
        .iti {
            width: 100%;
            display: block;
        }

        .iti__flag {
            background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/img/flags.png");
        }

        @media (-webkit-min-device-pixel-ratio: 2),
        (min-resolution: 192dpi) {
            .iti__flag {
                background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/img/flags@2x.png");
            }
        }
    </style>
</head>

<body class="portal-bg">
    <div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="card">
        <select id="languageSelector" class="language-selector">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇹🇼 繁體中文</option>
            <option value="jp">🇯🇵 日本語</option>
            <option value="kr">🇰🇷 한국어</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="it">🇮🇹 Italiano</option>
        </select>

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MXB6Mmo2ODEzYmU4aW1ia3JuZzg1dmszN2s5OGFjODJuY3ZmZnVpOSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bZCy0rf8TBRB2hYfUg/giphy.gif"
                alt="AI Cat" style="width: 100px; border-radius: 50%;">
        </div>

        <h2 data-i18n="trial_title">🎁 Free Trial Call (Beta)</h2>
        <form id="trialForm">
            <label data-i18n="label_name">👤 Name (English Only)</label>
            <input type="text" id="userName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                data-i18n-placeholder="placeholder_name" placeholder="English name only" required>

            <label data-i18n="label_phone">📞 Phone</label>
            <div class="phone-container">
                <input type="tel" id="targetPhone" required style="width: 100%;">
            </div>
            <div id="phoneHint" style="font-size: 11px; color: #ff4d4d; margin-top: 5px; display: none;"
                data-i18n="validation_phone">
                Invalid phone format for selected country
            </div>

            <label data-i18n="label_trial_script">📄 Trial Message Script (Max 30 words)</label>
            <textarea id="scriptContent" rows="4" data-i18n-placeholder="placeholder_trial_script"
                placeholder="What should the AI say?" required></textarea>
            <div id="wordCounter" style="text-align: right; font-size: 12px; color: #888; margin-top: 2px;">
                0 / 30 words
            </div>

            <div class="cf-turnstile" data-sitekey="0x4AAAAAACKreG1nTIC_lSzg" data-callback="onTurnstileSuccess"
                style="margin-top: 20px;"></div>

            <button type="submit" id="submitBtn" data-i18n="btn_trial" disabled>Try for Free</button>
            <a href="../Entry.html" class="back-link" data-i18n="btn_back">← Back to Portal</a>
            <div class="footer" data-i18n="footer">Automated call service provided by WiseCat AI</div>
        </form>
    </div>

    <script>
        const N8N_WEBHOOK = 'https://wisecat.app.n8n.cloud/webhook-test/line-reservation';
        const MAX_WORDS = 30;

        let turnstileValidated = false;
        let phoneInputPlugin = null;

        // Initialize intl-tel-input
        document.addEventListener("DOMContentLoaded", function () {
            const input = document.querySelector("#targetPhone");
            phoneInputPlugin = window.intlTelInput(input, {
                initialCountry: "auto",
                geoIpLookup: function (callback) {
                    fetch("https://ipapi.co/json")
                        .then(res => res.json())
                        .then(data => callback(data.country_code))
                        .catch(() => callback("us"));
                },
                preferredCountries: ["tw", "us", "jp", "kr", "cn"],
                utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
                separateDialCode: true
            });
        });

        function onTurnstileSuccess(token) {
            turnstileValidated = true;
            validateForm();
        }

        function countWords(str) {
            return str.trim().split(/\s+/).filter(word => word.length > 0).length;
        }

        function validateForm() {
            const btn = document.getElementById('submitBtn');
            const phoneInput = document.getElementById('targetPhone');
            const scriptInput = document.getElementById('scriptContent');
            const phoneHint = document.getElementById('phoneHint');

            let isPhoneValid = false;
            if (phoneInputPlugin) {
                isPhoneValid = phoneInputPlugin.isValidNumber();
            }

            const wordCount = countWords(scriptInput.value);
            const isScriptValid = wordCount > 0 && wordCount <= MAX_WORDS;

            if (turnstileValidated && isPhoneValid && isScriptValid) {
                btn.disabled = false;
                btn.style.opacity = "1";
            } else {
                btn.disabled = true;
                btn.style.opacity = "0.5";
            }

            // UI feedback for phone
            if (phoneInput.value && !isPhoneValid) {
                phoneInput.style.borderColor = "#ff4d4d";
                if (phoneHint) phoneHint.style.display = "block";
            } else {
                phoneInput.style.borderColor = "";
                if (phoneHint) phoneHint.style.display = "none";
            }

            // Word counter UI
            const counter = document.getElementById('wordCounter');
            counter.innerText = `${wordCount} / ${MAX_WORDS} words`;
            counter.style.color = wordCount > MAX_WORDS ? "#ff4d4d" : "#888";
        }

        const phoneInputEl = document.getElementById('targetPhone');
        phoneInputEl.addEventListener('input', validateForm);
        phoneInputEl.addEventListener('countrychange', validateForm);
        phoneInputEl.addEventListener('blur', validateForm);
        document.getElementById('scriptContent').addEventListener('input', (e) => {
            const words = e.target.value.trim().split(/\s+/);
            if (words.length > MAX_WORDS) {
                // Optional: truncation logic if preferred over simple validation
                // e.target.value = words.slice(0, MAX_WORDS).join(' ');
            }
            validateForm();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const userSession = localStorage.getItem('wisecat_user');
            if (userSession) {
                try {
                    const user = JSON.parse(userSession);
                    if (user.name) document.getElementById('userName').value = user.name;
                } catch (e) { }
            }
        });

        document.getElementById('trialForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const script = document.getElementById('scriptContent').value;

            if (countWords(script) > MAX_WORDS) {
                const dict = WiseCatI18n.translations[WiseCatI18n.currentLang] || WiseCatI18n.translations['en'];
                alert(dict.msg_trial_limit || "Too many words!");
                return;
            }

            btn.disabled = true;

            const payload = {
                type: 'trial',
                isTrial: true,
                Name: document.getElementById('userName').value,
                targetPhoneNumber: phoneInputPlugin ? phoneInputPlugin.getNumber() : document.getElementById('targetPhone').value,
                script: script,
                language: WiseCatI18n.currentLang
            };

            const dict = WiseCatI18n.translations[WiseCatI18n.currentLang] || WiseCatI18n.translations['en'];

            try {
                const response = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btn.innerText = dict.msg_success;
                    alert(dict.msg_calling);
                } else {
                    throw new Error();
                }
            } catch (error) {
                btn.innerText = dict.msg_failed;
                alert(dict.msg_fail_alert);
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>

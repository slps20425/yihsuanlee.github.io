<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Mouthpiece - AI Voice Proxy</title>
    <link rel="icon" href="../favicon.png" type="image/x-icon">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="../styles.css">
    <script src="../i18n.js" defer></script>
</head>

<body class="portal-bg">
    <div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="card">
        <select id="languageSelector" class="language-selector">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇹🇼 繁體中文</option>
            <option value="jp">🇯🇵 日本語</option>
            <option value="kr">🇰🇷 한국어</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="it">🇮🇹 Italiano</option>
        </select>

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MXB6Mmo2ODEzYmU4aW1ia3JuZzg1dmszN2s5OGFjODJuY3ZmZnVpOSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bZCy0rf8TBRB2hYfUg/giphy.gif"
                alt="AI Cat" style="width: 100px; border-radius: 50%;">
        </div>

        <h2 data-i18n="mouthpiece_title">📢 AI Mouthpiece</h2>
        <form id="mouthpieceForm">
            <label data-i18n="label_your_name">👤 Your Name</label>
            <input type="text" id="userName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                data-i18n-placeholder="placeholder_name" placeholder="English name only" required>

            <label data-i18n="label_recipient_name">👤 Recipient Name</label>
            <input type="text" id="recipientName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                data-i18n-placeholder="placeholder_recipient" placeholder="English name only" required>

            <label data-i18n="label_phone">📞 Recipient Phone</label>
            <div class="phone-container">
                <select id="countryCode" required style="width: 35%;">
                    <option value="+886">🇹🇼 +886</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+81">🇯🇵 +81</option>
                    <option value="+82">🇰🇷 +82</option>
                    <option value="+86">🇨🇳 +86</option>
                    <option value="+852">🇭🇰 +852</option>
                    <option value="+853">🇲🇴 +853</option>
                    <option value="+65">🇸🇬 +65</option>
                    <option value="+60">🇲🇾 +60</option>
                    <option value="+66">🇹🇭 +66</option>
                    <option value="+84">🇻🇳 +84</option>
                    <option value="+63">🇵🇭 +63</option>
                    <option value="+62">🇮🇩 +62</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+64">🇳🇿 +64</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+33">🇫🇷 +33</option>
                    <option value="+49">🇩🇪 +49</option>
                    <option value="+39">🇮🇹 +39</option>
                    <option value="+34">🇪🇸 +34</option>
                    <option value="+7">🇷🇺 +7</option>
                    <option value="+91">🇮🇳 +91</option>
                </select>
                <input type="tel" id="targetPhone" placeholder="912345678" required>
            </div>

            <label data-i18n="label_script">📄 AI Message Script</label>
            <textarea id="scriptContent" rows="4" data-i18n-placeholder="placeholder_script"
                placeholder="What should the AI say?" required></textarea>

            <label data-i18n="label_schedule" style="margin-top: 20px;">Schedule Call Preference</label>
            <select id="schedulePreference">
                <option value="asap" data-i18n="option_asap">Call ASAP</option>
                <option value="open" data-i18n="option_open">Call when available</option>
            </select>

            <div class="credits-card" style="margin-top: 45px;">
                <div class="credits-info">
                    <span id="creditsDisplay" data-i18n="text_credits" style="font-weight: bold; color: #fff;">Current
                        Credits: $0 USD</span>
                </div>
                <a href="https://core.newebpay.com/EPG/MS123456789/Example" target="_blank" data-i18n="btn_refill"
                    class="refill-btn">Refill</a>
            </div>

            <div class="cf-turnstile" data-sitekey="0x4AAAAAACKreG1nTIC_lSzg" data-callback="onTurnstileSuccess"
                style="margin-top: 20px;"></div>

            <button type="submit" id="submitBtn" data-i18n="btn_submit" disabled>Start AI Call</button>
            <a href="../Entry.html" class="back-link" data-i18n="btn_back">← Back to Portal</a>
            <div class="footer" data-i18n="footer">Automated call service provided by WiseCat AI</div>
        </form>
    </div>

    <!-- Help Buddy -->
    <button class="helper-buddy" id="helperBuddy">🐱</button>
    <div class="helper-panel" id="helperPanel">
        <div class="helper-header">
            <span data-i18n="helper_title">AI Prompt Helper 🐱</span>
            <span class="helper-close" id="helperClose">✕</span>
        </div>
        <!-- Examples are rendered dynamically from i18n.js -->
    </div>

    <script>
        const N8N_WEBHOOK = 'https://wisecat.app.n8n.cloud/webhook-test/line-reservation'; // Using same endpoint for now

        // Turnstile Success Callback
        function onTurnstileSuccess(token) {
            console.log("Turnstile Success, Token:", token);
            const btn = document.getElementById('submitBtn');
            const userSession = localStorage.getItem('wisecat_user');
            let credits = 0;
            if (userSession) {
                try {
                    const user = JSON.parse(userSession);
                    credits = parseFloat(user.credits) || 0;
                    console.log("Credits found:", credits);
                } catch (e) {
                    console.error("Error parsing user session:", e);
                }
            }

            if (credits > 0) {
                btn.disabled = false;
                console.log("Button enabled");
            } else {
                btn.disabled = true;
                console.log("Button stays disabled: insufficient credits");
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const userSession = localStorage.getItem('wisecat_user');
            if (userSession) {
                try {
                    const user = JSON.parse(userSession);
                    if (user.name) document.getElementById('userName').value = user.name;
                } catch (e) { }
            }
        });

        // ----------------------------------------------------
        // Form Submission Logic
        // ----------------------------------------------------
        document.getElementById('mouthpieceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            const payload = {
                type: 'mouthpiece',
                userName: document.getElementById('userName').value,
                recipientName: document.getElementById('recipientName').value,
                targetPhoneNumber: document.getElementById('countryCode').value + document.getElementById('targetPhone').value.replace(/^0+/, ''),
                script: document.getElementById('scriptContent').value,
                schedulePreference: document.getElementById('schedulePreference').value,
                language: WiseCatI18n.currentLang
            };

            const dict = WiseCatI18n.translations[WiseCatI18n.currentLang] || WiseCatI18n.translations['en'];

            const namePattern = /^[a-zA-Z\s\-_]*$/;
            if (!namePattern.test(payload.userName) || !namePattern.test(payload.recipientName)) {
                alert(dict.validation_name || "Name must be English letters only");
                btn.disabled = false;
                return;
            }

            try {
                const response = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btn.innerText = dict.msg_success;
                    alert(dict.msg_calling);
                } else {
                    throw new Error();
                }
            } catch (error) {
                btn.innerText = dict.msg_failed;
                alert(dict.msg_fail_alert);
                btn.disabled = false;
            }
        });

        // Helper Buddy Logic
        const buddy = document.getElementById('helperBuddy');
        const panel = document.getElementById('helperPanel');
        const close = document.getElementById('helperClose');

        buddy.addEventListener('click', () => panel.classList.toggle('show'));
        close.addEventListener('click', () => panel.classList.remove('show'));
    </script>
</body>

</html>

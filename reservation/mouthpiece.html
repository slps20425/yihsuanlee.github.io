<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Mouthpiece - AI Voice Proxy</title>
    <link rel="icon" href="../favicon.png" type="image/x-icon">
    <script>
        // Inline Handshake Script for Turnstile Reliability
        window.isTurnstileLoaded = false;
        window.onloadTurnstileCallback = function () {
            window.isTurnstileLoaded = true;
            if (window.renderAppTurnstile) {
                window.renderAppTurnstile();
            }
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit"
        async defer></script>


    <link rel="stylesheet" href="../styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <style>
        .iti {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body class="portal-bg">
    <div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="card">
        <select id="languageSelector" class="language-selector">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇹🇼 繁體中文</option>
            <option value="jp">🇯🇵 日本語</option>
            <option value="kr">🇰🇷 한국어</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="it">🇮🇹 Italiano</option>
        </select>

        <div style="text-align: center; margin-bottom: 10px;">
            <a href="https://wise-catty.cc/" style="display: inline-block;">
                <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MXB6Mmo2ODEzYmU4aW1ia3JuZzg1dmszN2s5OGFjODJuY3ZmZnVpOSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bZCy0rf8TBRB2hYfUg/giphy.gif"
                    alt="AI Cat" class="logo" style="width: 100px; border-radius: 50%; cursor: pointer;">
            </a>
        </div>

        <h2 data-i18n="mouthpiece_title">📢 AI Mouthpiece</h2>
        <form id="mouthpieceForm">
            <label data-i18n="label_your_name">👤 Your Name</label>
            <input type="text" id="userName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                data-i18n-placeholder="placeholder_name" placeholder="English name only" required>

            <label data-i18n="label_recipient_name">👤 Recipient Name</label>
            <input type="text" id="recipientName" pattern="[a-zA-Z\s\-_]*" maxlength="20"
                data-i18n-placeholder="placeholder_recipient" placeholder="English name only" required>

            <label data-i18n="label_mission" style="margin-top: 20px;">🎯 Choose Mission</label>
            <select id="mission" required
                style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white;">
                <option value="deliver_message" data-i18n="opt_mouth_deliver" selected>Deliver Message to Someone
                </option>
                <option value="check_info" data-i18n="opt_mouth_check">Check Information with Someone</option>
                <option value="other" data-i18n="opt_mouth_other">Other (Specify below)</option>
            </select>
            <input type="text" id="customMission"
                style="display: none; margin-top: 10px; width: 100%; padding: 12px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white;"
                data-i18n-placeholder="placeholder_custom_mission" placeholder="Describe your mission...">

            <label data-i18n="label_phone">📞 Recipient Phone</label>
            <div class="phone-container">
                <input type="tel" id="targetPhone" required style="width: 100%;">
            </div>
            <div id="phoneHint" style="font-size: 11px; color: #ff4d4d; margin-top: 5px; display: none;"
                data-i18n="validation_phone">
                Invalid phone format for selected country
            </div>

            <label data-i18n="label_script_language" style="margin-top: 15px;">🗣️ Speaking Language</label>
            <div style="font-size: 11px; color: #888; margin-bottom: 5px;" id="autoDetectHint">
                Default auto-detect based on phone number
            </div>
            <select id="scriptLanguage"
                style="width: 100%; padding: 12px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white; margin-bottom: 20px;">
                <option value="auto" data-i18n="option_auto" selected>✨ Auto-Detect</option>
                <option value="en">🇺🇸 English</option>
                <option value="zh">🇹🇼 繁體中文</option>
                <option value="jp">🇯🇵 日本語</option>
                <option value="kr">🇰🇷 한국어</option>
                <option value="es">🇪🇸 Español</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
            </select>

            <label data-i18n="label_script">📄 AI Message Script</label>
            <textarea id="scriptContent" rows="4" data-i18n-placeholder="placeholder_script"
                placeholder="What should the AI say?" required></textarea>

            <label data-i18n="label_schedule" style="margin-top: 20px;">Schedule Call Preference</label>
            <div class="schedule-options" style="margin-bottom: 15px;">
                <select id="schedulePreference"
                    style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white;">
                    <option value="asap" data-i18n="option_asap">Call ASAP</option>
                    <option value="scheduled" data-i18n="option_scheduled">Schedule a specific time</option>
                </select>

                <div id="scheduleContainer" style="display: none; padding-left: 10px; border-left: 2px solid #555;">
                    <label data-i18n="label_call_time">Call Time</label>
                    <input type="datetime-local" id="scheduleTime" style="width: 100%; margin-bottom: 5px;">
                    <div id="timezoneInfo" style="font-size: 12px; color: #aaa; margin-bottom: 15px;">
                        Timezone: <span id="detectedTimezone">Auto-detecting...</span>
                    </div>
                </div>
            </div>

            <div class="credits-card" style="margin-top: 45px;">
                <div class="credits-info">
                    <span id="creditsDisplay" data-i18n="text_credits" style="font-weight: bold; color: #fff;">Current
                        Credits: $0 USD</span>
                </div>
                <a href="https://core.newebpay.com/EPG/MS123456789/Example" target="_blank" data-i18n="btn_refill"
                    class="refill-btn">Refill</a>
            </div>

            <div id="turnstile-widget" style="margin-top: 20px;"></div>

            <button type="submit" id="submitBtn" data-i18n="btn_submit" disabled>Start AI Call</button>
            <a href="https://wise-catty.cc/" class="back-link" data-i18n="btn_back">← Back to Portal</a>
            <div class="footer" data-i18n="footer">Automated call service provided by WiseCat AI</div>
        </form>
    </div>

    <!-- Help Buddy -->
    <button class="helper-buddy" id="helperBuddy">🐱</button>
    <div class="helper-panel" id="helperPanel">
        <div class="helper-header">
            <span data-i18n="helper_title">AI Prompt Helper 🐱</span>
            <span class="helper-close" id="helperClose">✕</span>
        </div>
        <!-- Examples are rendered dynamically from i18n.js -->
    </div>

    <script type="module" src="../src/mouthpiece.ts"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reservation System</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-color: #00b900;
            --dark-gray: #1a1a1a;
            --medium-gray: #2d2d2d;
            --text-light: #eeeeee;
        }

        body {
            font-family: -apple-system, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Gradient dark gray background */
            background: linear-gradient(135deg, #0f0f0f 0%, #2c2c2c 100%);
            padding: 20px;
            color: var(--text-light);
        }

        .card {
            background: var(--medium-gray);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            font-size: 24px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #bbb;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #444;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            background: #1a1a1a;
            color: white;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #222;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 185, 0, 0.2);
        }

        button:disabled {
            background-color: #444;
            color: #888;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>✨ AI 智能訂位</h2>
        <form id="resForm">
            <label>👤 姓名 (英文拼音)</label>
            <input type="text" id="userName" required>

            <label>👥 人數</label>
            <input type="number" id="partySize" value="3" min="1" required>

            <label>📅 預約日期</label>
            <input type="date" id="resDate" required>

            <label>⏰ 預約時間</label>
            <input type="time" id="resTime" required>

            <label>📞 餐廳電話</label>
            <input type="tel" id="targetPhone" value="+886" required>

             <label>📍 餐廳地址 (選填)</label>
            <input type="text" id="restaurantAddress" placeholder="輸入地址後按 Enter 顯示地圖">

            <div id="mapContainer" style="display: none; margin-top: 15px; border-radius: 12px; overflow: hidden; height: 250px;">
                <iframe id="mapFrame" width="100%" height="100%" frameborder="0" style="border:0" allowfullscreen="" loading="lazy"></iframe>
            </div>
            
            <button type="submit" id="submitBtn">啟動 AI 撥號</button>
            <div class="footer">由 AI 助手提供自動化撥號服務</div>
        </form>
    </div>

    <script>
        const LIFF_ID = '2008812650-lyjR7Z5O';
        const N8N_WEBHOOK = 'https://wisecat.app.n8n.cloud/webhook-test/line-reservation';

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    document.getElementById('userName').value = profile.displayName || "";
                }
            } catch (err) {
                console.error('LIFF Init Error', err);
            }
        }

        document.getElementById('resForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '正在處理預約...';

            const payload = {
                Name: document.getElementById('userName').value,
                'Party Size': document.getElementById('partySize').value,
                'date/month/year': document.getElementById('resDate').value,
                time: document.getElementById('resTime').value,
                targetPhoneNumber: document.getElementById('targetPhone').value,
                language: 'zh'
            };

            try {
                const response = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                btn.innerText = '✅ 預約成功！';
                alert('AI 助手已開始撥號！');

            } catch (error) {
                console.error('Error:', error);
                btn.innerText = '❌ 預約失敗';
                alert('預約失敗，請稍後再試');
            } finally {
                btn.disabled = false;
            }
        });

        initLiff();
    </script>
</body>

</html>

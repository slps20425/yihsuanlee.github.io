<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Reservation</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-color: #00b900;
            --primary-dark: #009800;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 185, 0, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 185, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #abdca3;
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>✨ 智能預約系統</h2>
        <form id="resForm">
            <div class="input-group">
                <label>👤 姓名 (英文拼音)</label>
                <input type="text" id="userName" placeholder="載入中..." required>
            </div>

            <div class="input-group">
                <label>👥 人數</label>
                <input type="number" id="partySize" value="3" min="1" required>
            </div>

            <div class="input-group">
                <label>📅 預約日期</label>
                <input type="date" id="resDate" required>
            </div>

            <div class="input-group">
                <label>⏰ 預約時間</label>
                <input type="time" id="resTime" required>
            </div>

            <div class="input-group">
                <label>📞 餐廳電話</label>
                <input type="tel" id="targetPhone" value="+886" required>
            </div>

            <button type="submit" id="submitBtn">立即撥打電話</button>
            <p class="footer-text">點擊後 AI 將立即為您撥號預約</p>
        </form>
    </div>

    <script>
        const LIFF_ID = '2008812650-lyjR7Z5O';
        const N8N_WEBHOOK = 'https://wisecat.app.n8n.cloud/webhook/line-reservation';

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    document.getElementById('userName').placeholder = profile.displayName || "例如: Evan";
                    if (!document.getElementById('userName').value) {
                        document.getElementById('userName').value = profile.displayName || "";
                    }
                }
            } catch (err) {
                console.error('LIFF Initialization failed', err);
            }
        }

        document.getElementById('resForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '🚀 正在啟動 AI 撥號...';

            const payload = {
                Name: document.getElementById('userName').value,
                'Party Size': document.getElementById('partySize').value,
                'date/month/year': document.getElementById('resDate').value,
                time: document.getElementById('resTime').value,
                targetPhoneNumber: document.getElementById('targetPhone').value,
                language: 'zh'
            };

            try {
                // FIXED: Using no-cors to prevent browser popup errors
                fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Assume success and send LINE message
                await liff.sendMessages([{
                    type: 'text',
                    text: `✅ 預約指令已發送！\nAI 正在撥打電話中...\n姓名：${payload.Name}\n電話：${payload.targetPhoneNumber}`
                }]);

                setTimeout(() => { liff.closeWindow(); }, 1500);

            } catch (error) {
                alert('系統繁忙，請稍後再試');
                btn.disabled = false;
                btn.innerText = '立即撥打電話';
            }
        });

        initLiff();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Reservation Assistant</title>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-color: #00b900;
            --dark-gray: #1a1a1a;
            --medium-gray: #2d2d2d;
            --text-light: #eeeeee;
        }

        body {
            font-family: -apple-system, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f0f 0%, #2c2c2c 100%);
            padding: 20px;
            color: var(--text-light);
        }

        .card {
            background: var(--medium-gray);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 100;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            font-size: 24px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #bbb;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #444;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            background: #1a1a1a;
            color: white;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #222;
        }

        .phone-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .phone-container select {
            width: 35%;
            flex-shrink: 0;
        }

        .phone-container input {
            width: 65%;
            margin-top: 0;
        }

        .search-container {
            position: relative;
            margin-top: 5px;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 12px;
            margin-top: 5px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:hover {
            background: #2a2a2a;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .result-name {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .result-address {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }

        .result-phone {
            font-size: 13px;
            color: #bbb;
        }

        .loading {
            padding: 12px;
            text-align: center;
            color: #999;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 185, 0, 0.2);
            transition: background-color 0.3s;
        }

        button:hover:not(:disabled) {
            background-color: #00a000;
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .map-container {
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            height: 250px;
            display: none;
        }

        .map-container.show {
            display: block;
        }

        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .language-selector {
            display: block;
            width: fit-content;
            margin: 0 0 15px auto;
            padding: 8px 12px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <canvas id="bg-canvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></canvas>
    <div class="card">
        <select id="languageSelector" class="language-selector">
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇹🇼 繁體中文</option>
            <option value="jp">🇯🇵 日本語</option>
            <option value="kr">🇰🇷 한국어</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="it">🇮🇹 Italiano</option>
        </select>

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MXB6Mmo2ODEzYmU4aW1ia3JuZzg1dmszN2s5OGFjODJuY3ZmZnVpOSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bZCy0rf8TBRB2hYfUg/giphy.gif"
                alt="AI Cat" style="width: 100px; border-radius: 50%;">
        </div>

        <h2 data-i18n="title">✨ AI Reservation</h2>
        <form id="resForm">
            <label data-i18n="label_name">👤 Name (English Only)</label>
            <input type="text" id="userName" pattern="[a-zA-Z\s]*" maxlength="20"
                data-i18n-placeholder="placeholder_name" placeholder="English name only" required>

            <label data-i18n="label_party">👥 Party Size</label>
            <input type="number" id="partySize" value="3" min="1" required>

            <label data-i18n="label_date">📅 Date</label>
            <input type="text" id="resDate" data-i18n-placeholder="placeholder_date" placeholder="Select Date"
                onfocus="(this.type='date')" onblur="(this.value ? this.type='date' : this.type='text')" required>

            <label data-i18n="label_time">⏰ Time</label>
            <input type="time" id="resTime" required>

            <label data-i18n="label_search">🔍 Search Restaurant</label>
            <div class="search-container">
                <input type="text" id="restaurantSearch" data-i18n-placeholder="placeholder_search"
                    placeholder="Enter restaurant name or address">
                <div class="info-text" data-i18n="info_search">Phone number auto-filled after search</div>
                <div id="searchResults" class="search-results"></div>
            </div>

            <label data-i18n="label_phone">📞 Phone</label>
            <div class="phone-container">
                <select id="countryCode" required>
                    <option value="+886">🇹🇼 +886</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+81">🇯🇵 +81</option>
                    <option value="+82">🇰🇷 +82</option>
                    <option value="+86">🇨🇳 +86</option>
                    <option value="+852">🇭🇰 +852</option>
                    <option value="+853">🇲🇴 +853</option>
                    <option value="+65">🇸🇬 +65</option>
                    <option value="+60">🇲🇾 +60</option>
                    <option value="+66">🇹🇭 +66</option>
                    <option value="+84">🇻🇳 +84</option>
                    <option value="+63">🇵🇭 +63</option>
                    <option value="+62">🇮🇩 +62</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+64">🇳🇿 +64</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+33">🇫🇷 +33</option>
                    <option value="+49">🇩🇪 +49</option>
                    <option value="+39">🇮🇹 +39</option>
                    <option value="+34">🇪🇸 +34</option>
                    <option value="+7">🇷🇺 +7</option>
                    <option value="+91">🇮🇳 +91</option>
                </select>
                <input type="tel" id="targetPhone" placeholder="912345678" required>
            </div>

            <label data-i18n="label_note">📝 Special Requests (Optional)</label>
            <textarea id="note" rows="3"
                style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #444; border-radius: 12px; font-size: 16px; background: #1a1a1a; color: white;"
                data-i18n-placeholder="placeholder_note" placeholder="Any special requests?"></textarea>

            <div id="mapContainer" class="map-container">
                <div id="map" style="width: 100%; height: 100%;"></div>
            </div>

            <label data-i18n="label_schedule" style="margin-top: 20px;">Schedule Call Preference</label>
            <select id="schedulePreference">
                <option value="open" data-i18n="option_open">Call when restaurant open</option>
                <option value="asap" data-i18n="option_asap">Call ASAP</option>
            </select>

            <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="retryOption" style="width: 20px; height: 20px; margin: 0;">
                <label for="retryOption" style="margin: 0; display: inline;">
                    <span data-i18n="label_retry">Re-try 1 time</span>
                    <span data-i18n="warning_retry" style="color: #ff4444; font-size: 12px; margin-left: 5px;">(This
                        will charge you twice, careful)</span>
                </label>
            </div>

            <div
                style="margin-top: 25px; padding: 15px; background: #222; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444;">
                <span data-i18n="text_credits" style="font-weight: bold; color: #fff;">Current Credits: $0 USD</span>
                <a href="https://core.newebpay.com/EPG/MS123456789/Example" target="_blank" data-i18n="btn_refill"
                    style="padding: 8px 16px; background: #007bff; color: white; text-decoration: none; border-radius: 8px; font-size: 14px;">Refill
                    Credits</a>
            </div>

            <button type="submit" id="submitBtn" data-i18n="btn_submit">Start AI Call</button>
            <div class="footer" data-i18n="footer">Automated call service provided by AI Assistant</div>
        </form>
    </div>

    <script>
        const LIFF_ID = '2008812650-lyjR7Z5O';
        const N8N_WEBHOOK = 'https://wisecat.app.n8n.cloud/webhook-test/line-reservation';
        const GOOGLE_MAPS_API_KEY = 'AIzaSyA1ycN9_H2nI_Oh8ZypPtGcqyZ5QQhkLIk';

        let map;
        let placesService;
        let searchTimeout;
        let currentMarker = null;

        // Cache to reduce API calls
        const placeDetailsCache = {};

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    document.getElementById('userName').value = profile.displayName || "";
                }
            } catch (err) {
                console.error('LIFF Init Error', err);
            }
        }

        // Load Google Maps API dynamically
        function loadGoogleMapsAPI() {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&language=zh-TW`;
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Initialize Google Maps
        async function initMap() {
            try {
                await loadGoogleMapsAPI();

                // Default center (Taipei)
                const defaultLocation = { lat: 25.0330, lng: 121.5654 };

                map = new google.maps.Map(document.getElementById('map'), {
                    center: defaultLocation,
                    zoom: 15,
                    styles: [
                        {
                            "elementType": "geometry",
                            "stylers": [{ "color": "#212121" }]
                        },
                        {
                            "elementType": "labels.text.fill",
                            "stylers": [{ "color": "#757575" }]
                        },
                        {
                            "elementType": "labels.text.stroke",
                            "stylers": [{ "color": "#212121" }]
                        }
                    ]
                });

                placesService = new google.maps.places.PlacesService(map);

            } catch (error) {
                console.error('Error loading Google Maps:', error);
                alert('無法載入 Google Maps。請確認網路連線。');
            }
        }

        // Get place details with phone number (with caching)
        function getPlaceDetails(placeId) {
            // Check cache first
            if (placeDetailsCache[placeId]) {
                console.log('Using cached place details');
                return Promise.resolve(placeDetailsCache[placeId]);
            }

            return new Promise((resolve, reject) => {
                const request = {
                    placeId: placeId,
                    fields: ['name', 'formatted_address', 'formatted_phone_number', 'international_phone_number', 'geometry']
                };

                placesService.getDetails(request, (place, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        // Cache the result
                        placeDetailsCache[placeId] = place;
                        resolve(place);
                    } else {
                        reject(status);
                    }
                });
            });
        }

        // Search for places
        async function searchPlaces(query) {
            if (!query || query.length < 2) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '<div class="loading">搜尋中...</div>';
            resultsContainer.classList.add('show');

            // Auto-detect location based on query
            let location = { lat: 25.0330, lng: 121.5654 }; // Default: Taipei

            // If query contains Japanese characters, search in Tokyo
            if (/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/.test(query)) {
                location = { lat: 35.6762, lng: 139.6503 }; // Tokyo
            }

            const request = {
                query: query + ' restaurant',
                fields: ['name', 'formatted_address', 'place_id', 'geometry'],
                locationBias: location
            };

            placesService.textSearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                    displaySearchResults(results.slice(0, 5));
                } else {
                    resultsContainer.innerHTML = '<div class="loading">找不到餐廳</div>';
                }
            });
        }

        // Display search results
        function displaySearchResults(places) {
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            places.forEach(place => {
                const item = document.createElement('div');
                item.className = 'search-result-item';

                const name = document.createElement('div');
                name.className = 'result-name';
                name.textContent = place.name;

                const address = document.createElement('div');
                address.className = 'result-address';
                address.textContent = place.formatted_address || '地址未提供';

                const phone = document.createElement('div');
                phone.className = 'result-phone';
                phone.textContent = '點擊查看電話';

                item.appendChild(name);
                item.appendChild(address);
                item.appendChild(phone);

                item.addEventListener('click', async () => {
                    phone.textContent = '載入中...';
                    try {
                        const detailedPlace = await getPlaceDetails(place.place_id);
                        selectPlace(detailedPlace);
                    } catch (error) {
                        console.error('Error getting place details:', error);
                        alert('無法取得餐廳電話，請手動輸入');
                        selectPlace(place);
                    }
                });

                resultsContainer.appendChild(item);
            });
        }

        // Select a place from search results
        function selectPlace(place) {
            console.log('Selected place:', place);

            // Fill in phone number
            const phoneNumber = place.international_phone_number || place.formatted_phone_number;

            if (phoneNumber) {
                console.log('Phone found:', phoneNumber);

                // Clean phone number
                let cleanPhone = phoneNumber.replace(/\s/g, '').replace(/-/g, '').replace(/\(/g, '').replace(/\)/g, '');

                // Handle Taiwan numbers
                if (cleanPhone.startsWith('+886')) {
                    document.getElementById('countryCode').value = '+886';
                    document.getElementById('targetPhone').value = cleanPhone.substring(4);
                }
                // Handle Japan numbers
                else if (cleanPhone.startsWith('+81')) {
                    document.getElementById('countryCode').value = '+81';
                    document.getElementById('targetPhone').value = cleanPhone.substring(3);
                }
                // Handle local format (starting with 0)
                else if (cleanPhone.startsWith('0')) {
                    // Detect if it's Taiwan or Japan based on phone length or context
                    // Taiwan mobile: 09XX-XXX-XXX (10 digits)
                    // Japan: 0X-XXXX-XXXX or 03-XXXX-XXXX (9-10 digits)
                    if (cleanPhone.length === 10 && cleanPhone.startsWith('09')) {
                        // Taiwan mobile
                        document.getElementById('countryCode').value = '+886';
                        document.getElementById('targetPhone').value = cleanPhone.substring(1);
                    } else {
                        // Assume Japan for other 0-prefix numbers
                        document.getElementById('countryCode').value = '+81';
                        document.getElementById('targetPhone').value = cleanPhone.substring(1);
                    }
                }
                else if (cleanPhone.startsWith('+')) {
                    const countryCodeMatch = cleanPhone.match(/^\+(\d{1,3})/);
                    if (countryCodeMatch) {
                        const code = '+' + countryCodeMatch[1];
                        document.getElementById('countryCode').value = code;
                        document.getElementById('targetPhone').value = cleanPhone.substring(code.length);
                    }
                }
                else {
                    // Default: Taiwan
                    document.getElementById('countryCode').value = '+886';
                    document.getElementById('targetPhone').value = cleanPhone;
                }
            } else {
                console.warn('No phone number available');
                alert('此餐廳沒有提供電話號碼，請手動輸入');
            }

            // Update map
            if (place.geometry && place.geometry.location) {
                map.setCenter(place.geometry.location);
                map.setZoom(17);

                // Clear existing marker
                if (currentMarker) {
                    currentMarker.setMap(null);
                }

                currentMarker = new google.maps.Marker({
                    map: map,
                    position: place.geometry.location,
                    title: place.name,
                    animation: google.maps.Animation.DROP
                });

                document.getElementById('mapContainer').classList.add('show');
            }

            // Hide search results
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('restaurantSearch').value = place.name;
        }

        // Restaurant search with debounce
        document.getElementById('restaurantSearch').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchPlaces(e.target.value);
            }, 500);
        });

        // Hide search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchResults').classList.remove('show');
            }
        });

        document.getElementById('resForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Sending...'; // Temporary fallback or could be from translation

            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('targetPhone').value.replace(/^0+/, '');
            const fullPhoneNumber = countryCode + phoneNumber;

            const payload = {
                Name: document.getElementById('userName').value,
                'Party Size': document.getElementById('partySize').value,
                'date/month/year': document.getElementById('resDate').value,
                time: document.getElementById('resTime').value,
                targetPhoneNumber: fullPhoneNumber,
                note: document.getElementById('note').value,
                language: currentLang,
                schedulePreference: document.getElementById('schedulePreference').value,
                retryOneTime: document.getElementById('retryOption').checked
            };

            // Validation for Name (Double check)
            const namePattern = /^[a-zA-Z\s]*$/;
            if (!namePattern.test(payload.Name)) {
                alert(translations[currentLang].validation_name);
                btn.disabled = false;
                btn.innerText = translations[currentLang].btn_submit;
                return;
            }

            console.log('Sending payload:', payload);

            try {
                const response = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Check if response has content before parsing JSON
                const contentType = response.headers.get('content-type');
                let result = null;
                if (contentType && contentType.includes('application/json')) {
                    const text = await response.text();
                    if (text) {
                        result = JSON.parse(text);
                    }
                }

                btn.innerText = translations[currentLang].msg_success;
                alert(translations[currentLang].msg_calling);

                setTimeout(() => {
                    btn.innerText = translations[currentLang].btn_submit;
                    btn.disabled = false;
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                btn.innerText = translations[currentLang].msg_failed;
                alert(translations[currentLang].msg_fail_alert);

                setTimeout(() => {
                    btn.innerText = translations[currentLang].btn_submit;
                    btn.disabled = false;
                }, 2000);
            }
        });

        // ----------------------------------------------------
        // Multi-language Logic
        // ----------------------------------------------------
        let currentLang = 'en';

        const translations = {
            en: {
                title: "WiseCat Reservation Assistant",
                label_name: "Name (English Only)",
                placeholder_name: "English name only",
                label_party: "Party Size",
                label_date: "Date",
                label_time: "Time",
                label_search: "Search Restaurant",
                placeholder_search: "Enter restaurant name or address",
                info_search: "Phone number auto-filled after search",
                label_phone: "Phone",
                label_note: "Special Requests (Optional)",
                placeholder_note: "Any special requests?",
                btn_submit: "Start AI Call",
                footer: "Automated call service provided by WiseCat AI",
                validation_name: "Name must be English letters only",
                msg_calling: "WiseCat Assistant is calling!",
                msg_success: "Success",
                msg_failed: "Failed",
                msg_fail_alert: "Reservation failed, please try again",
                placeholder_date: "Select Date",
                label_schedule: "Schedule Call Preference",
                option_open: "Call when restaurant open",
                option_asap: "Call ASAP",
                label_retry: "Re-try 1 time",
                warning_retry: "(This will charge you twice, careful)",
                text_credits: "Current Credits: $0 USD",
                btn_refill: "Refill Credits"
            },
            zh: {
                title: "WiseCat 訂位助手",
                label_name: "姓名 (限英文)",
                placeholder_name: "請輸入英文姓名",
                label_party: "人數",
                label_date: "預約日期",
                label_time: "預約時間",
                label_search: "搜尋餐廳",
                placeholder_search: "輸入餐廳名稱或地址搜尋",
                info_search: "搜尋後自動填入電話號碼",
                label_phone: "餐廳電話",
                label_note: "備註 (選填)",
                placeholder_note: "有什麼特殊需求嗎？",
                btn_submit: "啟動 AI 撥號",
                footer: "由 WiseCat AI 提供自動化撥號服務",
                validation_name: "姓名限英文",
                msg_calling: "WiseCat 助手已開始撥號！",
                msg_success: "預約成功",
                msg_failed: "預約失敗",
                msg_fail_alert: "預約失敗，請稍後再試",

        function updateLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.getElementById('languageSelector').value = lang;
            localStorage.setItem('preferredLanguage', lang);

            // Update Text
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // Update Placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });

            // Update Title
            document.title = translations[lang].title;

            // Allow name patterns to change? Currently keeping English pattern strict
            // But we might want to update alerts logic
        }

        // Initialize Language
        const savedLang = localStorage.getItem('preferredLanguage');
        const browserLang = navigator.language.slice(0, 2);
        const initialLang = savedLang || (translations[browserLang] ? browserLang : 'en');
        updateLanguage(initialLang);

        // Event Listener
        document.getElementById('languageSelector').addEventListener('change', (e) => {
            updateLanguage(e.target.value);
        });

        // Initialize
        initLiff();
        initMap();

        // Background Animation
        // Background Animation
        function startBackgroundAnimation() {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let animationFrameId;

            // Configuration
            const particleCount = 50;
            const connectionDistance = 150;
            const mouseDistance = 200;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            window.addEventListener('resize', resize);
            resize();

            const mouse = { x: null, y: null };
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.x;
                mouse.y = e.y;
            });
            window.addEventListener('mouseout', () => {
                mouse.x = null;
                mouse.y = null;
            });

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 2 + 1;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;

                    // Mouse interaction
                    if (mouse.x != null) {
                        let dx = mouse.x - this.x;
                        let dy = mouse.y - this.y;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < mouseDistance) {
                            const forceDirectionX = dx / distance;
                            const forceDirectionY = dy / distance;
                            const force = (mouseDistance - distance) / mouseDistance;
                            // Gentle repulsion/attraction
                            const directionX = forceDirectionX * force * 0.5;
                            const directionY = forceDirectionY * force * 0.5;
                        }
                    }
                }

                draw() {
                    ctx.fillStyle = 'rgba(0, 185, 0, 0.4)'; // Primary Green
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();

                    for (let j = i; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < connectionDistance) {
                            ctx.beginPath();
                            // Green lines for the AI feel
                            ctx.strokeStyle = `rgba(0, 185, 0, ${0.15 - distance / connectionDistance * 0.15})`;
                            ctx.lineWidth = 1;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                animationFrameId = requestAnimationFrame(animate);
            }

            initParticles();
            // Cancel previous frame if any (though scoping prevents it, good for restart)
            if (window.bgAnimationFrame) cancelAnimationFrame(window.bgAnimationFrame);
            animate();
            window.bgAnimationFrame = animationFrameId;
        }

        // Initialize Animation Safely
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startBackgroundAnimation);
        } else {
            startBackgroundAnimation();
        }

        // Re-initialize on page show (bfcache support)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                startBackgroundAnimation();
            }
        });
    </script>

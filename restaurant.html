<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reservation System</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --primary-color: #00b900;
            --dark-gray: #1a1a1a;
            --medium-gray: #2d2d2d;
            --text-light: #eeeeee;
        }

        body {
            font-family: -apple-system, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f0f 0%, #2c2c2c 100%);
            padding: 20px;
            color: var(--text-light);
        }

        .card {
            background: var(--medium-gray);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            font-size: 24px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #bbb;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #444;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            background: #1a1a1a;
            color: white;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #222;
        }

        .phone-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .phone-container select {
            width: 35%;
            flex-shrink: 0;
        }

        .phone-container input {
            width: 65%;
            margin-top: 0;
        }

        .search-container {
            position: relative;
            margin-top: 5px;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 12px;
            margin-top: 5px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:hover {
            background: #2a2a2a;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .result-name {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .result-address {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }

        .result-phone {
            font-size: 13px;
            color: #bbb;
        }

        .loading {
            padding: 12px;
            text-align: center;
            color: #999;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 185, 0, 0.2);
            transition: background-color 0.3s;
        }

        button:hover:not(:disabled) {
            background-color: #00a000;
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .map-container {
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            height: 250px;
            display: none;
        }

        .map-container.show {
            display: block;
        }

        .info-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>✨ AI 智能訂位</h2>
        <form id="resForm">
            <label>👤 姓名 (英文拼音)</label>
            <input type="text" id="userName" required>

            <label>👥 人數</label>
            <input type="number" id="partySize" value="3" min="1" required>

            <label>📅 預約日期</label>
            <input type="date" id="resDate" required>

            <label>⏰ 預約時間</label>
            <input type="time" id="resTime" required>

            <label>🔍 搜尋餐廳</label>
            <div class="search-container">
                <input type="text" id="restaurantSearch" placeholder="輸入餐廳名稱或地址搜尋">
                <div class="info-text">搜尋後自動填入電話號碼</div>
                <div id="searchResults" class="search-results"></div>
            </div>

            <label>📞 餐廳電話</label>
            <div class="phone-container">
                <select id="countryCode" required>
                    <option value="+886">🇹🇼 +886</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+81">🇯🇵 +81</option>
                    <option value="+82">🇰🇷 +82</option>
                    <option value="+86">🇨🇳 +86</option>
                    <option value="+852">🇭🇰 +852</option>
                    <option value="+853">🇲🇴 +853</option>
                    <option value="+65">🇸🇬 +65</option>
                    <option value="+60">🇲🇾 +60</option>
                    <option value="+66">🇹🇭 +66</option>
                    <option value="+84">🇻🇳 +84</option>
                    <option value="+63">🇵🇭 +63</option>
                    <option value="+62">🇮🇩 +62</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+64">🇳🇿 +64</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+33">🇫🇷 +33</option>
                    <option value="+49">🇩🇪 +49</option>
                    <option value="+39">🇮🇹 +39</option>
                    <option value="+34">🇪🇸 +34</option>
                    <option value="+7">🇷🇺 +7</option>
                    <option value="+91">🇮🇳 +91</option>
                </select>
                <input type="tel" id="targetPhone" placeholder="912345678" required>
            </div>

            <div id="mapContainer" class="map-container">
                <div id="map" style="width: 100%; height: 100%;"></div>
            </div>
            
            <button type="submit" id="submitBtn">啟動 AI 撥號</button>
            <div class="footer">由 AI 助手提供自動化撥號服務</div>
        </form>
    </div>

    <script>
        const LIFF_ID = '2008812650-lyjR7Z5O';
        const N8N_WEBHOOK = 'https://wisecat.app.n8n.cloud/webhook-test/line-reservation';
        const GOOGLE_MAPS_API_KEY = 'AIzaSyA1ycN9_H2nI_Oh8ZypPtGcqyZ5QQhkLIk';

        let map;
        let placesService;
        let searchTimeout;
        let currentMarker = null;

        // Cache to reduce API calls
        const placeDetailsCache = {};

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    document.getElementById('userName').value = profile.displayName || "";
                }
            } catch (err) {
                console.error('LIFF Init Error', err);
            }
        }

        // Load Google Maps API dynamically
        function loadGoogleMapsAPI() {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&language=zh-TW`;
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Initialize Google Maps
        async function initMap() {
            try {
                await loadGoogleMapsAPI();
                
                // Default center (Taipei)
                const defaultLocation = { lat: 25.0330, lng: 121.5654 };
                
                map = new google.maps.Map(document.getElementById('map'), {
                    center: defaultLocation,
                    zoom: 15,
                    styles: [
                        {
                            "elementType": "geometry",
                            "stylers": [{"color": "#212121"}]
                        },
                        {
                            "elementType": "labels.text.fill",
                            "stylers": [{"color": "#757575"}]
                        },
                        {
                            "elementType": "labels.text.stroke",
                            "stylers": [{"color": "#212121"}]
                        }
                    ]
                });

                placesService = new google.maps.places.PlacesService(map);

            } catch (error) {
                console.error('Error loading Google Maps:', error);
                alert('無法載入 Google Maps。請確認網路連線。');
            }
        }

        // Get place details with phone number (with caching)
        function getPlaceDetails(placeId) {
            // Check cache first
            if (placeDetailsCache[placeId]) {
                console.log('Using cached place details');
                return Promise.resolve(placeDetailsCache[placeId]);
            }

            return new Promise((resolve, reject) => {
                const request = {
                    placeId: placeId,
                    fields: ['name', 'formatted_address', 'formatted_phone_number', 'international_phone_number', 'geometry']
                };

                placesService.getDetails(request, (place, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        // Cache the result
                        placeDetailsCache[placeId] = place;
                        resolve(place);
                    } else {
                        reject(status);
                    }
                });
            });
        }

        // Search for places
        async function searchPlaces(query) {
            if (!query || query.length < 2) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '<div class="loading">搜尋中...</div>';
            resultsContainer.classList.add('show');

            // Auto-detect location based on query
            let location = { lat: 25.0330, lng: 121.5654 }; // Default: Taipei
            
            // If query contains Japanese characters, search in Tokyo
            if (/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/.test(query)) {
                location = { lat: 35.6762, lng: 139.6503 }; // Tokyo
            }

            const request = {
                query: query + ' restaurant',
                fields: ['name', 'formatted_address', 'place_id', 'geometry'],
                locationBias: location
            };

            placesService.textSearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                    displaySearchResults(results.slice(0, 5));
                } else {
                    resultsContainer.innerHTML = '<div class="loading">找不到餐廳</div>';
                }
            });
        }

        // Display search results
        function displaySearchResults(places) {
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            places.forEach(place => {
                const item = document.createElement('div');
                item.className = 'search-result-item';
                
                const name = document.createElement('div');
                name.className = 'result-name';
                name.textContent = place.name;
                
                const address = document.createElement('div');
                address.className = 'result-address';
                address.textContent = place.formatted_address || '地址未提供';
                
                const phone = document.createElement('div');
                phone.className = 'result-phone';
                phone.textContent = '點擊查看電話';
                
                item.appendChild(name);
                item.appendChild(address);
                item.appendChild(phone);
                
                item.addEventListener('click', async () => {
                    phone.textContent = '載入中...';
                    try {
                        const detailedPlace = await getPlaceDetails(place.place_id);
                        selectPlace(detailedPlace);
                    } catch (error) {
                        console.error('Error getting place details:', error);
                        alert('無法取得餐廳電話，請手動輸入');
                        selectPlace(place);
                    }
                });
                
                resultsContainer.appendChild(item);
            });
        }

        // Select a place from search results
        function selectPlace(place) {
            console.log('Selected place:', place);
            
            // Fill in phone number
            const phoneNumber = place.international_phone_number || place.formatted_phone_number;
            
            if (phoneNumber) {
                console.log('Phone found:', phoneNumber);
                
                // Clean phone number
                let cleanPhone = phoneNumber.replace(/\s/g, '').replace(/-/g, '').replace(/\(/g, '').replace(/\)/g, '');
                
                // Handle Taiwan numbers
                if (cleanPhone.startsWith('+886')) {
                    document.getElementById('countryCode').value = '+886';
                    document.getElementById('targetPhone').value = cleanPhone.substring(4);
                } 
                // Handle Japan numbers
                else if (cleanPhone.startsWith('+81')) {
                    document.getElementById('countryCode').value = '+81';
                    document.getElementById('targetPhone').value = cleanPhone.substring(3);
                }
                // Handle local format (starting with 0)
                else if (cleanPhone.startsWith('0')) {
                    // Detect if it's Taiwan or Japan based on phone length or context
                    // Taiwan mobile: 09XX-XXX-XXX (10 digits)
                    // Japan: 0X-XXXX-XXXX or 03-XXXX-XXXX (9-10 digits)
                    if (cleanPhone.length === 10 && cleanPhone.startsWith('09')) {
                        // Taiwan mobile
                        document.getElementById('countryCode').value = '+886';
                        document.getElementById('targetPhone').value = cleanPhone.substring(1);
                    } else {
                        // Assume Japan for other 0-prefix numbers
                        document.getElementById('countryCode').value = '+81';
                        document.getElementById('targetPhone').value = cleanPhone.substring(1);
                    }
                }
                else if (cleanPhone.startsWith('+')) {
                    const countryCodeMatch = cleanPhone.match(/^\+(\d{1,3})/);
                    if (countryCodeMatch) {
                        const code = '+' + countryCodeMatch[1];
                        document.getElementById('countryCode').value = code;
                        document.getElementById('targetPhone').value = cleanPhone.substring(code.length);
                    }
                }
                else {
                    // Default: Taiwan
                    document.getElementById('countryCode').value = '+886';
                    document.getElementById('targetPhone').value = cleanPhone;
                }
            } else {
                console.warn('No phone number available');
                alert('此餐廳沒有提供電話號碼，請手動輸入');
            }

            // Update map
            if (place.geometry && place.geometry.location) {
                map.setCenter(place.geometry.location);
                map.setZoom(17);
                
                // Clear existing marker
                if (currentMarker) {
                    currentMarker.setMap(null);
                }
                
                currentMarker = new google.maps.Marker({
                    map: map,
                    position: place.geometry.location,
                    title: place.name,
                    animation: google.maps.Animation.DROP
                });
                
                document.getElementById('mapContainer').classList.add('show');
            }

            // Hide search results
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('restaurantSearch').value = place.name;
        }

        // Restaurant search with debounce
        document.getElementById('restaurantSearch').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchPlaces(e.target.value);
            }, 500);
        });

        // Hide search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchResults').classList.remove('show');
            }
        });

        document.getElementById('resForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '正在處理預約...';

            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('targetPhone').value.replace(/^0+/, '');
            const fullPhoneNumber = countryCode + phoneNumber;

            const payload = {
                Name: document.getElementById('userName').value,
                'Party Size': document.getElementById('partySize').value,
                'date/month/year': document.getElementById('resDate').value,
                time: document.getElementById('resTime').value,
                targetPhoneNumber: fullPhoneNumber,
                language: 'zh'
            };

            console.log('Sending payload:', payload);

            try {
                const response = await fetch(N8N_WEBHOOK, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Check if response has content before parsing JSON
                const contentType = response.headers.get('content-type');
                let result = null;
                if (contentType && contentType.includes('application/json')) {
                    const text = await response.text();
                    if (text) {
                        result = JSON.parse(text);
                    }
                }

                btn.innerText = '✅ 預約成功！';
                alert('AI 助手已開始撥號！');
                
                setTimeout(() => {
                    btn.innerText = '啟動 AI 撥號';
                    btn.disabled = false;
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                btn.innerText = '❌ 預約失敗';
                alert('預約失敗，請稍後再試');
                
                setTimeout(() => {
                    btn.innerText = '啟動 AI 撥號';
                    btn.disabled = false;
                }, 2000);
            }
        });

        // Initialize
        initLiff();
        initMap();
    </script>
</body>

</html>

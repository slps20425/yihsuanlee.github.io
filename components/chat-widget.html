<!-- RAG Chatbot Widget -->
<!-- Chat Toggle Button -->
<button id="chatToggle" class="chat-toggle-btn">
    <img src="/icon-192.png" alt="WiseCat" class="chat-icon-img"
        style="width: 28px; height: 28px; object-fit: contain;">
    <span>WiseCat</span>
</button>

<!-- Chat Panel -->
<div id="chatPanel" class="chat-panel" style="display: none;">
    <div class="chat-header">
        <div class="flex items-center gap-2">
            <img src="/logo.png" alt="WiseCat AI" style="height: 28px; object-fit: contain;">
            <!-- <span class="font-semibold text-white">WiseCat Assistant</span> -->
        </div>
        <button id="chatClose" class="chat-close-btn" aria-label="Close Chat">
            ✕
        </button>
    </div>
    <div id="chatMessages" class="chat-messages">
        <!-- Default Welcome Message -->
        <div class="chat-message bot">
            <div class="message-content">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                    <img src="/icon-192.png" alt="WiseCat" style="width:24px; height:24px;">
                    <strong>Hi! I'm your WiseCat assistant</strong>
                </div>

                I can help you with:
                • 💰 Credits and billing
                • 📞 Making calls (Mouthpiece, Trial, Restaurant)
                • 📱 Phone numbers
                • 🔧 Troubleshooting
                • ❓ Any WiseCat questions

                Just ask me anything about WiseCat!
            </div>
        </div>
    </div>

    <div class="chat-input-container">
        <div class="chat-input-wrapper">
            <input type="text" id="chatInput" placeholder="Ask about WiseCat..." autocomplete="off" />
        </div>
        <button id="chatSend" class="chat-send-btn">Send</button>
    </div>
</div>

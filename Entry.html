<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseCat Portal</title>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <style>
        :root {
            --primary-color: #00b900;
            --secondary-color: #007bff;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-light: #eeeeee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f0f 0%, #2c2c2c 100%);
            padding: 20px;
            color: var(--text-light);
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .logo {
            width: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 185, 0, 0.4);
        }

        h1 {
            font-size: 28px;
            margin: 0;
            background: linear-gradient(45deg, #fff, #aaa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .subtitle {
            font-size: 16px;
            color: #888;
            margin-top: 10px;
        }

        .credits-card {
            background: linear-gradient(145deg, #222, #111);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .credits-info {
            text-align: left;
        }

        .credits-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .credits-amount {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 5px;
        }

        .refill-btn {
            background: var(--secondary-color);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }

        .refill-btn:hover {
            transform: scale(1.05);
            background: #0056b3;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: var(--primary-color);
        }

        .card-icon {
            font-size: 32px;
            background: rgba(0, 0, 0, 0.3);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
        }

        .card-content {
            text-align: left;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-desc {
            font-size: 13px;
            color: #aaa;
        }

        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #555;
        }

        /* Animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        .delay-1 {
            animation-delay: 0.1s;
        }

        .delay-2 {
            animation-delay: 0.2s;
        }

        .delay-3 {
            animation-delay: 0.3s;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Logo & Title -->
        <div class="header fade-in">
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3MXB6Mmo2ODEzYmU4aW1ia3JuZzg1dmszN2s5OGFjODJuY3ZmZnVpOSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/bZCy0rf8TBRB2hYfUg/giphy.gif"
                alt="WiseCat Logo" class="logo">
            <h1>WiseCat Portal</h1>
            <div class="subtitle">Your Personal AI Assistant Hub</div>
        </div>

        <!-- Credits Section -->
        <div class="credits-card fade-in delay-1">
            <div class="credits-info">
                <div class="credits-label">Available Balance</div>
                <div class="credits-amount">$0.00 USD</div>
            </div>
            <a href="https://core.newebpay.com/EPG/MS123456789/Example" target="_blank" class="refill-btn">Refill +</a>
        </div>

        <!-- Menu Grid -->
        <div class="menu-grid">
            <!-- Restaurant Reservation -->
            <a href="reservation/restaurant_reservation.html" class="menu-card fade-in delay-2">
                <div class="card-icon">🍽️</div>
                <div class="card-content">
                    <div class="card-title">Restaurant Reservation</div>
                    <div class="card-desc">AI-powered booking assistant for any restaurant</div>
                </div>
            </a>

            <!-- Mouthpiece (New Service) -->
            <a href="reservation/mouthpiece.html" class="menu-card fade-in delay-3">
                <div class="card-icon">📢</div>
                <div class="card-content">
                    <div class="card-title">Mouthpiece Service</div>
                    <div class="card-desc">AI Voice representation service (Beta)</div>
                </div>
            </a>


        </div>

        <div class="footer fade-in delay-3">
            &copy; 2026 WiseCat AI. All rights reserved.
        </div>
    </div>
</body>

</html>
